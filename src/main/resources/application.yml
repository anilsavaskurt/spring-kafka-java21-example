spring:
  application:
    name: spring-kafka-java21-example
  datasource:
    # Local docker-compose defaults; override with SPRING_DATASOURCE_* environment variables
    url: jdbc:postgresql://localhost:5432/orderdb
    username: appuser
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false      # REST layer only works with Order records, no lazy loading needed
    hibernate:
      ddl-auto: update
  threads:
    virtual:
      enabled: true          # Java 21 virtual threads for Tomcat and listener containers
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: order-processor
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.example.kafka.domain.OrderEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.example.kafka.domain

app:
  kafka:
    topics:
      orders: orders
      partitions: 3
    retry:
      attempts: 4            # 1 initial attempt + 3 retries, then the DLT
      delay-ms: 1000
      multiplier: 2.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
